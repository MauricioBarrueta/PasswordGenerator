<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="sass/styles.css">
    <title>Generador de Contraseñas</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
</head>
<body>
    <div class="container">
        <span class="title">Crea tu contraseña personalizada de forma rápida y sencilla en solo 3 pasos</span>

        <div class="pass-char">
            <p class="div-title">1. Caracteres que puede incluir tu contraseña:</p>
            <div class="row">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="lowercase" checked>
                    <label class="form-check-label" for="lowercase">Minúsculas (a - z)</label>
                </div> 
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="numbers">
                    <label class="form-check-label" for="numbers">Números (0 - 9)</label>
                </div> 
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="spaces">
                    <label class="form-check-label" for="spaces">Incluir espacios</label>
                </div>            
            </div>

            <div class="row">                
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="uppercase">
                    <label class="form-check-label" for="uppercase">Mayúsculas (A - Z)</label>
                </div>  
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="symbols">
                    <label class="form-check-label" for="symbols">Símbolos (!@#)...
                        <button class="btn btn-link symbols-info" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="~`!@#$%^&*()_-+={[}]|\:;<>''.?/">
                            &#x3f;
                        </button>
                    </label>
                </div>  
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="not-repeat">
                    <label class="form-check-label" for="not-repeat"><b>NO</b> repetir caracteres</label>
                </div> 
            </div>
        </div>

        <div class="pass-length">
            <p class="div-title">2. Cantidad de caracteres de tu contraseña:</p>
            <small>Entre más caracteres tenga, más segura será</small>

            <span class="length-value w-100"><!-- Valor del rango --></span>
            <input class="form-range pass-length-input" type="range" min="0" max="20" value="10">

            <div class="progress" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar progress-bar-striped"></div>
            </div>    
            <span class="sec-level-text w-100"></span> 
        </div>

        <button class="btn btn-danger" id="generate-pass">3. Haz clic para generar tu contraseña</button>
        <div class="generated-password">        
            <input type="text" class="form-control" id="generated-pass-input" placeholder="Tu contraseña aparecerá aquí" readonly>      
            <button type="submit" class="btn btn-danger" id="copy-password" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Copiar">&#xf0c5;</button>        
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    
    <script src="js/main.js"></script>
</body>
</html>
